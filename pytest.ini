[pytest]
testpaths = tests
pythonpath = src
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    unit: Tests unitaires sans dépendance externe ni réseau
    integration: Tests d'intégration nécessitant un service externe ou une base
    external: tests qui appellent une API externe (Open-Meteo, ORS)
    territory: Tests de validation du référentiel territorial (146 communes)
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
