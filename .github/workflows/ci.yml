name: CI Pipeline

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'feature/**'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 3. Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: 4. Verify Python syntax
        run: |
          python -m compileall -q src tests app

      - name: 5. Code quality (Ruff)
        run: |
          ruff check .

      - name: 6. Execute unit tests with pytest
        run: |
          pytest -m "not integration" --cov=src --cov-report=term-missing --cov-report=xml

      - name: 7. CI Summary
        if: always()
        run: |
          echo "### CI Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** Done" >> $GITHUB_STEP_SUMMARY
